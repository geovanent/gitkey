<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 220" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="920" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0F172A"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="60" y1="40" x2="360" y2="180">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
  </defs>
  <rect width="920" height="220" rx="16" fill="url(#bg)"/>
  <rect x="1" y="1" width="918" height="218" rx="15" stroke="url(#accent)" stroke-opacity="0.25"/>

  <g transform="translate(48,46) scale(1.05)">
    <circle cx="36" cy="36" r="22" stroke="url(#accent)" stroke-width="5"/>
    <circle cx="36" cy="36" r="9" fill="#0F172A" stroke="url(#accent)" stroke-width="3"/>
    <path d="M58 36 H88 V48 H76 V60 H88 V72 H58 Z" fill="url(#accent)"/>
    <circle cx="94" cy="22" r="5" fill="#00D4AA"/>
    <path d="M94 27 V44 M94 33 H106 M94 39 H102" stroke="#00D4AA" stroke-width="3" stroke-linecap="round"/>
  </g>

  <text x="150" y="98" font-family="system-ui, sans-serif" font-size="56" font-weight="700" fill="#F8FAFC">gitkey</text>
  <text x="152" y="138" font-family="system-ui, sans-serif" font-size="20" fill="#94A3B8">SSH keys &amp; Git identity - one command</text>

  <rect x="152" y="158" width="118" height="32" rx="16" fill="#00D4AA" fill-opacity="0.12" stroke="#00D4AA" stroke-opacity="0.4"/>
  <text x="168" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#5EEAD4" font-weight="600">multi-profile</text>

  <rect x="280" y="158" width="100" height="32" rx="16" fill="#6366F1" fill-opacity="0.15" stroke="#818CF8" stroke-opacity="0.45"/>
  <text x="296" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#A5B4FC" font-weight="600">per-repo</text>

  <rect x="390" y="158" width="88" height="32" rx="16" fill="#22D3EE" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.4"/>
  <text x="406" y="180" font-family="system-ui, sans-serif" font-size="13" fill="#67E8F9" font-weight="600">zero deps</text>

  <rect x="560" y="36" width="320" height="148" rx="12" fill="#020617" stroke="#334155"/>
  <circle cx="580" cy="56" r="5" fill="#EF4444"/>
  <circle cx="598" cy="56" r="5" fill="#F59E0B"/>
  <circle cx="616" cy="56" r="5" fill="#22C55E"/>
  <text x="580" y="92" font-family="monospace" font-size="13" fill="#64748B">$</text>
  <text x="596" y="92" font-family="monospace" font-size="13" fill="#22D3EE">gitkey -p personal</text>
  <text x="580" y="118" font-family="monospace" font-size="12" fill="#00D4AA">+ SSH profile: personal</text>
  <text x="580" y="142" font-family="monospace" font-size="12" fill="#00D4AA">+ Git: Your Name</text>
  <text x="580" y="166" font-family="monospace" font-size="12" fill="#94A3B8">$ git push</text>
